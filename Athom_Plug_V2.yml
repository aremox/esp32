substitutions:
  name: "athom-smart-plug-v2"
  friendly_name: "Smart Plug V2 Salon"
  room: "Salon"
  device_description: "Athom Plug V2 con Vigilante"
  project_name: "Athom.PlugV2"
  project_version: "2.1.1"
  relay_restore_mode: RESTORE_DEFAULT_ON
  current_limit : "16"
  # --- VIGILANTE ---
  comprobacion_cada: 60s
  max_fallos_y: "3"
  tiempo_apagado_z: 10s
  url_objetivo: "http://google.com"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true

esp8266:
  board: esp8285
  restore_from_flash: true
  early_pin_init: true
  framework:
    version: recommended

preferences:
  flash_write_interval: 15min

ota:
  - platform: esphome

logger:
  level: INFO
  baud_rate: 0

network:
  enable_ipv6: false

api:
  encryption:
    key: gBTyoXXxsnpRJAkWOPgPgQzSqEdEFSsE7yDXjXgBdys=
  reboot_timeout: 2h

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  manual_ip:
    static_ip: 192.168.1.116
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 1.1.1.1

uart:
  rx_pin: RX
  baud_rate: 4800
  parity: EVEN

http_request:
  verify_ssl: false
  useragent: esphome/device
  timeout: 3s

globals:
  - id: total_energy
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: contador_fallos
    type: int
    initial_value: '0'
  - id: total_reboot_count
    type: int
    restore_value: yes
    initial_value: '0'
  - id: bloqueado_por_reinicio
    type: bool
    initial_value: 'false'
  - id: peticion_en_curso
    type: bool
    initial_value: 'false'

script:
  - id: ciclo_reinicio_por_fallo
    mode: single
    then:
      - lambda: id(bloqueado_por_reinicio) = true;
      - lambda: id(total_reboot_count) += 1;
      - switch.turn_off: relay
      - delay: ${tiempo_apagado_z}
      - switch.turn_on: relay    
      - lambda: id(contador_fallos) = 0;
      - delay: 10min
      - lambda: id(bloqueado_por_reinicio) = false;

interval:
  - interval: ${comprobacion_cada} 
    startup_delay: 45s
    then:
      - if:
          condition:
            lambda: 'return !id(peticion_en_curso) && !id(bloqueado_por_reinicio);'
          then:
            - lambda: id(peticion_en_curso) = true;
            - http_request.get:
                url: ${url_objetivo}
                on_response:
                  then:
                    - lambda: |-
                        id(peticion_en_curso) = false;
                        int status = response->status_code;
                        if (status >= 200 && status < 300) {
                          id(contador_fallos) = 0;
                          id(estado_web).publish_state(true);
                        } else {
                          id(contador_fallos) += 1;
                          id(estado_web).publish_state(false);
                        }
                on_error:
                  then:
                    - lambda: |-
                        id(peticion_en_curso) = false;
                        id(contador_fallos) += 1;
                        id(estado_web).publish_state(false);
      - if:
          condition:
            lambda: 'return id(contador_fallos) >= ${max_fallos_y};'
          then:
            - script.execute: ciclo_reinicio_por_fallo

binary_sensor:
  - platform: status
    name: "Status"
  - platform: gpio
    pin: {number: 5, mode: INPUT_PULLUP, inverted: true}
    id: power_button
    on_multi_click:
      - timing: ["ON for at most 1s", "OFF for at least 0.2s"]
        then: [switch.toggle: relay]
  - platform: template
    name: "Estado Web"
    id: estado_web

sensor:
  - platform: uptime
    name: "Uptime Segundos"
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: template
    name: "Fallos Vigilante"
    lambda: return id(contador_fallos);
    update_interval: 30s
  - platform: template
    name: "Reinicios Totales"
    lambda: return id(total_reboot_count);
    update_interval: 60s

  - platform: cse7766
    current:
      name: "Current"
      on_value_range:
        - above: ${current_limit}
          then: [switch.turn_off: relay]
    voltage:
      name: "Voltage"
    power:
      name: "Power"
      id: power_sensor
    energy:
      id: energy
      internal: true
      on_value:
        then:
          - lambda: |-
              static float prev = 0.0;
              float curr = id(energy).state;
              if (curr > prev) {
                id(total_energy) += (curr - prev) * 0.001;
              }
              prev = curr;

  - platform: template
    name: "Total Energy"
    unit_of_measurement: kWh
    device_class: "energy"
    state_class: "total_increasing"
    lambda: return id(total_energy);
    update_interval: 30s

button:
  - platform: restart
    name: "Restart Device"
    id: restart_button

switch:
  - platform: gpio
    name: "Relay"
    pin: GPIO12
    id: relay
    restore_mode: ${relay_restore_mode}

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP"

time:
  - platform: sntp
    id: sntp_time
